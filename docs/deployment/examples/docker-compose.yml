services:
  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_HOST_PORT:-8081}:80"
    environment:
      - SERVER_NAME=${SERVER_NAME:-finance.midomain.com}
      - FRONTEND_UPSTREAM=${FRONTEND_UPSTREAM:-nextjs:3000}
      - BACKEND_UPSTREAM=${BACKEND_UPSTREAM:-api:3001}
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
    depends_on:
      - nextjs
      - api
    networks:
      - app-network
    command: >
      sh -c "envsubst '$${SERVER_NAME} $${FRONTEND_UPSTREAM} $${BACKEND_UPSTREAM}'
      < /etc/nginx/templates/nginx.conf.template > /etc/nginx/nginx.conf
      && nginx -g 'daemon off;'"

  nextjs:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    environment:
      - NEXT_PUBLIC_API_URL=http://api:3001 # Use service name!
    depends_on:
      - api
    networks:
      - app-network

  api:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/finance-app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: finance-app
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge

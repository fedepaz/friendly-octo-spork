name: Tests

on:
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build --filter=@repo/shared
      - run: pnpm test

  integration-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: appfinance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      
      - run: pnpm install --frozen-lockfile
      - run: pnpm build --filter=@repo/shared
      
      - name: Setup test database
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/appfinance_test
        run: npx prisma migrate deploy
      
      - name: Run integration tests
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/appfinance_test
          DATABASE_HOST: localhost
          DATABASE_PORT: "5432"
          DATABASE_DATABASE_NAME: appfinance_test
          DATABASE_USER: test
          DATABASE_PASSWORD: test
          JWT_SECRET: ci-test-jwt-secret-for-integration-32ch
          JWT_REFRESH_SECRET: ci-test-refresh-secret-for-integration
          JWT_EXPIRES_IN: 60m
          JWT_REFRESH_EXPIRES_IN: 7d
          DEFAULT_PASSWORD: "123456"
          BACKEND_NODE_ENV: development
          PORT: "3001"
        run: npx jest --runInBand --config ./test/integration/jest.config.ts

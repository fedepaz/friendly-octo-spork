name: Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/appfinance-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/appfinance-frontend

jobs:
  test:
    uses: ./.github/workflows/ci-test.yml

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: app
          file: app/apps/backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:main-${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: app
          file: app/apps/frontend/Dockerfile
          push: true
          no-cache: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:main-${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy placeholder
        run: |
          echo "TODO: Add deploy step here"
          echo "Images pushed:"
          echo "  - ${{ env.BACKEND_IMAGE }}:main-${{ github.sha }}"
          echo "  - ${{ env.FRONTEND_IMAGE }}:main-${{ github.sha }}"

name: CI Tests

on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: pnpm build --filter=@repo/shared
        working-directory: app
      - run: pnpm lint
        working-directory: app

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: pnpm build --filter=@repo/shared
        working-directory: app
      - run: pnpm test
        working-directory: app

  integration-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: appfinance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: pnpm build --filter=@repo/shared
        working-directory: app

      - name: Setup test database
        working-directory: app/apps/backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/appfinance_test
        run: npx prisma migrate deploy

      - name: Run integration tests
        working-directory: app/apps/backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/appfinance_test
          DATABASE_HOST: localhost
          DATABASE_PORT: "5432"
          DATABASE_DATABASE_NAME: appfinance_test
          DATABASE_USER: test
          DATABASE_PASSWORD: test
          JWT_SECRET: ci-test-jwt-secret-for-integration-32ch
          JWT_REFRESH_SECRET: ci-test-refresh-secret-for-integration
          JWT_EXPIRES_IN: 60m
          JWT_REFRESH_EXPIRES_IN: 7d
          DEFAULT_PASSWORD: "123456"
          BACKEND_NODE_ENV: development
          PORT: "3001"
        run: npx jest --runInBand --config ./test/integration/jest.config.ts
